<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Tap World</title>
  <style>
    :root { --bg: #05060a; --ink: #e8eef7; --ink-dim: #6b7588; --neon: #6df4ff; --neon-warm: #ff7ad8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
    body {
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
    }
    .mark {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 1.5px solid var(--neon);
      display: grid; place-items: center;
      box-shadow: 0 0 32px rgba(109,244,255,.35), inset 0 0 18px rgba(109,244,255,.12);
      margin-bottom: 32px;
    }
    .dot {
      width: 16px; height: 16px;
      background: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--neon);
    }
    h1 { font-size: 44px; letter-spacing: 4px; line-height: 1; margin-bottom: 14px; }
    .sub { color: var(--ink-dim); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
    .tagline { font-size: 16px; max-width: 460px; color: var(--ink); margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      background: var(--neon);
      color: #04141a;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 3px;
      font-size: 13px;
      box-shadow: 0 6px 28px rgba(109,244,255,.35);
      margin: 6px;
    }
    a.btn.ghost {
      background: transparent;
      color: var(--ink-dim);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: none;
    }
    .footer {
      margin-top: 56px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ink-dim);
    }
  </style>
</head>
<body>
  <div class="mark"><span class="dot"></span></div>
  <h1>ONE TAP<br/>WORLD</h1>
  <p class="sub">every tap rewrites reality</p>
  <p class="tagline">A minimalist puzzle game built around a single, deceptively simple
  action: tap. Each touch flips gravity, shifts the world, and reshapes the path.</p>

  <div>
    <a class="btn" href="#">Download on the App Store</a>
    <a class="btn ghost" href="privacy.html">Privacy Policy</a>
  </div>

  <p class="footer">© 2026 ONE TAP WORLD</p>
</body>
</html>
